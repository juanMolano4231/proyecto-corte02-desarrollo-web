<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Laboral</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/3.4.0/paper/bootstrap.min.css">

</head>

<body>
    <div class="container">
        <h1 class="text-center">3 EXPERIENCIA LABORAL</h1>
        <br>

        <form action="#">

            <div class="checkbox"><label><input type="checkbox" name="validacionTrabajando" value="Publica">¿Se encuentra trabajando?</label></div>

            <fieldset class="form-group">
                <legend>Empleo actual o contrato vigente</legend>

                <div class="form-group">
                    <div id="error-primerApellido" class="text-danger"></div>
                    <label for="primerApellido">Empresa o entidad</label>
                    <input type="text" class="form-control" id="primerApellido" name="primerApellido">
                </div>

                <div class="radio"><label><input type="radio" name="tipoEmpresa" value="Publica"> Publica</label></div>
                <div class="radio"><label><input type="radio" name="tipoEmpresa" value="Privada"> Privada</label></div>

                <div class="form-group">
                    <div id="error-pais" class="text-danger"></div>
                    <label for="pais">Pais</label>
                    <input type="text" class="form-control" id="pais" name="pais">
                </div>

                <div class="form-group">
                    <div id="error-municipio" class="text-danger"></div>
                    <label for="municipio">Municipio</label>
                    <input type="text" class="form-control" id="municipio" name="municipio">
                </div>

                <div class="form-group">
                    <div id="error-correo" class="text-danger"></div>
                    <label for="correo">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo">
                </div>

                <div class="form-group">
                    <div id="error-telefonos" class="text-danger"></div>
                    <label for="telefonos">Teléfonos</label>
                    <input type="text" class="form-control" id="telefonos" name="telefonos">
                </div>

                <div class="form-group">
                    <label for="fechaIngreso">Fecha de ingreso</label>
                    <input type="date" class="form-control" id="fechaIngreso" name="fechaIngreso" min="1900-01-01">
                </div>

                <div class="form-group">
                    <div id="error-cargoActual" class="text-danger"></div>
                    <label for="cargoActual">Cargo actual</label>
                    <input type="text" class="form-control" id="cargoActual" name="cargoActual">
                </div>

                <div class="form-group">
                    <div id="error-dependencia" class="text-danger"></div>
                    <label for="dependencia">Dependencia</label>
                    <input type="text" class="form-control" id="dependencia" name="dependencia">
                </div>

                <div class="form-group">
                    <div id="error-direccion" class="text-danger"></div>
                    <label for="direccion">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion">
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Empleo o contrato anterior</legend>

                <div class="form-group">
                    <div id="error-primerApellido" class="text-danger"></div>
                    <label for="primerApellido">Empresa o entidad</label>
                    <input type="text" class="form-control" id="primerApellido" name="primerApellido">
                </div>

                <div class="radio"><label><input type="radio" name="tipoEmpresa" value="Publica"> Publica</label></div>
                <div class="radio"><label><input type="radio" name="tipoEmpresa" value="Privada"> Privada</label></div>

                <div class="form-group">
                    <div id="error-pais" class="text-danger"></div>
                    <label for="pais">Pais</label>
                    <input type="text" class="form-control" id="pais" name="pais">
                </div>

                <div class="form-group">
                    <div id="error-municipio" class="text-danger"></div>
                    <label for="municipio">Municipio</label>
                    <input type="text" class="form-control" id="municipio" name="municipio">
                </div>

                <div class="form-group">
                    <div id="error-correo" class="text-danger"></div>
                    <label for="correo">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo">
                </div>

                <div class="form-group">
                    <div id="error-telefonos" class="text-danger"></div>
                    <label for="telefonos">Teléfonos</label>
                    <input type="text" class="form-control" id="telefonos" name="telefonos">
                </div>

                <div class="form-group">
                    <label for="fechaIngreso">Fecha de ingreso</label>
                    <input type="date" class="form-control" id="fechaIngreso" name="fechaIngreso" min="1900-01-01">
                </div>


                <div class="form-group">
                    <label for="fechaRetiro">Fecha de retiro</label>
                    <input type="date" class="form-control" id="fechaRetiro" name="fechaRetiro" min="1900-01-01">
                </div>

                <div class="form-group">
                    <div id="error-cargoActual" class="text-danger"></div>
                    <label for="cargoActual">Cargo actual</label>
                    <input type="text" class="form-control" id="cargoActual" name="cargoActual">
                </div>

                <div class="form-group">
                    <div id="error-dependencia" class="text-danger"></div>
                    <label for="dependencia">Dependencia</label>
                    <input type="text" class="form-control" id="dependencia" name="dependencia">
                </div>

                <div class="form-group">
                    <div id="error-direccion" class="text-danger"></div>
                    <label for="direccion">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion">
                </div>
            </fieldset>

            <button type="new" class="btn btn-primary">Agregar otro contrato interior</button>

            <button type="submit" class="btn btn-primary">Revisar</button>

             <br><br>
        </form>
    </div>
</body>

</html>
