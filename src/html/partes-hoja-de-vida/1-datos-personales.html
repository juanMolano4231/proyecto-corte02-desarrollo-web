<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Personales</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/3.4.0/paper/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h1 class="text-center">1 DATOS PERSONALES</h1>
        <br>

        <form action="#">
            <fieldset class="form-group">
                <legend>Nombre completo</legend>

                <div class="form-group">
                    <div id="error-primerApellido" class="text-danger"></div>
                    <label for="primerApellido">Primer apellido</label>
                    <input type="text" class="form-control" id="primerApellido" name="primerApellido">
                </div>

                <div class="form-group">
                    <div id="error-segundoApellido" class="text-danger"></div>
                    <label for="segundoApellido">Segundo apellido</label>
                    <input type="text" class="form-control" id="segundoApellido" name="segundoApellido">
                </div>

                <div class="form-group">
                    <div id="error-nombres" class="text-danger"></div>
                    <label for="nombres">Nombres</label>
                    <input type="text" class="form-control" id="nombres" name="nombres">
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Documento de identificación</legend>

                <div class="radio"><label><input type="radio" name="tipoDocumento" value="cc" checked> C.C</label></div>
                <div class="radio"><label><input type="radio" name="tipoDocumento" value="ce"> C.E</label></div>
                <div class="radio"><label><input type="radio" name="tipoDocumento" value="pas"> PAS</label></div>

                <div class="form-group">
                    <div id="error-numeroDocumento" class="text-danger"></div>
                    <label for="numeroDocumento">No.</label>
                    <input type="number" class="form-control" id="numeroDocumento" name="numeroDocumento">
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Sexo</legend>
                <div class="radio"><label><input type="radio" name="sexo" value="masculino" checked> Masculino</label>
                </div>
                <div class="radio"><label><input type="radio" name="sexo" value="femenino"> Femenino</label></div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Nacionalidad</legend>
                <div class="form-group">
                    <label for="nacionalidad">Nacionalidad</label>
                    <select class="form-control" id="nacionalidad" name="nacionalidad"></select>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Libreta militar</legend>

                <div class="radio"><label><input type="radio" name="claseLibreta" value="primera" checked> Primera
                        clase</label></div>
                <div class="radio"><label><input type="radio" name="claseLibreta" value="segunda"> Segunda clase</label>
                </div>

                <div class="form-group">
                    <div id="error-numeroLibreta" class="text-danger"></div>
                    <label for="numeroLibreta">Número</label>
                    <input type="number" class="form-control" id="numeroLibreta" name="numeroLibreta">
                </div>

                <div class="form-group">
                    <label for="distritoMilitar">Distrito militar</label>
                    <select class="form-control" id="distritoMilitar" name="distritoMilitar"></select>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Fecha y lugar de nacimiento</legend>

                <div class="form-group">
                    <div id="error-fechaNacimiento" class="text-danger"></div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento"
                        min="1900-01-01">
                </div>

                <div class="form-group">
                    <label for="paisNacimiento">País</label>
                    <select class="form-control" id="paisNacimiento" name="paisNacimiento"></select>
                </div>

                <div class="form-group">
                    <div id="error-regionNacimiento" class="text-danger"></div>
                    <label for="regionNacimiento">Región</label>
                    <input type="text" class="form-control" id="regionNacimiento" name="regionNacimiento">
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>Dirección de correspondencia</legend>

                <div class="form-group">
                    <label for="paisResidencia">País</label>
                    <select class="form-control" id="paisResidencia" name="paisResidencia"></select>
                </div>

                <div class="form-group">
                    <div id="error-regionResidencia" class="text-danger"></div>
                    <label for="regionResidencia">Región</label>
                    <input type="text" class="form-control" id="regionResidencia" name="regionResidencia">
                </div>

                <div class="form-group">
                    <div id="error-direccion" class="text-danger"></div>
                    <label for="direccion">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion">
                </div>

                <div class="form-group">
                    <div id="error-telefono" class="text-danger"></div>
                    <label for="telefono">Teléfono</label>
                    <input type="text" class="form-control" id="telefono" name="telefono">
                </div>

                <div class="form-group">
                    <div id="error-email" class="text-danger"></div>
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Revisar</button>

            <br><br>
        </form>
    </div>

    <div id="confirmModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">Confirmar datos</h4>
                </div>
                <div class="modal-body">
                    <pre id="confirmData" style="white-space:pre-wrap;"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Editar</button>
                    <button type="button" class="btn btn-primary" id="confirmSave">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="module" src="1-datos-personales.js"></script>
</body>

</html>
