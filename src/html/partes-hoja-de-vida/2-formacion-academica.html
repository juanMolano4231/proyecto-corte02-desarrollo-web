<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formación Académica</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

<div class="container">
    <h1 class="text-center">2 FORMACIÓN ACADÉMICA</h1>

    <br>

    <form>
        <fieldset class="form-group">
            <legend>Educación básica y media</legend>

            <div class="form-group">
                <label for="edu">Educación básica</label>
                <select class="form-control" id="edu" name="educacion">
                    <option value="1">1o.</option>
                    <option value="2">2o.</option>
                    <option value="3">3o.</option>
                    <option value="4">4o.</option>
                    <option value="5">5o.</option>
                    <option value="6">6o.</option>
                    <option value="7">7o.</option>
                    <option value="8">8o.</option>
                    <option value="9">9o.</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                </select>
            </div>

            <div class="form-group">
                <label for="titulo">Título obtenido</label>
                <input type="text" class="form-control" id="titulo" name="titulo">
            </div>

            <!-- fecha de grado con js -->
        </fieldset>

        <fieldset class="form-group">
            <legend>Educación superior (pregrado y posgrado)</legend>

            <!-- Con js -->
        </fieldset>

        <fieldset class="form-group">
            <legend>Idiomas</legend>

            <!-- Con js -->
        </fieldset>

        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>

</html>
