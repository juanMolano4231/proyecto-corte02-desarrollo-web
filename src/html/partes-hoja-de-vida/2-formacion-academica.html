<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formación Académica</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/3.4.0/paper/bootstrap.min.css">
</head>

<body>

    <div class="container">
        <h1 class="text-center">2 FORMACIÓN ACADÉMICA</h1>

        <br>

        <form action="#">
            <fieldset class="form-group">
                <legend>Educación básica y media</legend>

                <div class="form-group">
                    <label for="educacionBasica">Educacion basica</label>
                    <select class="form-control" id="educacionBasica" name="educacionBasica"></select>
                </div>

                <div class="form-group">
                    <div id="error-titulo" class="text-danger"></div>
                    <label for="titulo">Título obtenido</label>
                    <input type="text" class="form-control" id="titulo" name="titulo">
                </div>

                <div class="form-group">
                    <div id="error-fechaGrado" class="text-danger"></div>
                    <label for="fechaGrado">Fecha de grado</label>
                    <input type="date" class="form-control" id="fechaGrado" name="fechaGrado" min="1900-01-01">
                </div>

            </fieldset>

            <fieldset class="form-group">
                <legend>Educación superior (pregrado y posgrado)</legend>
                <label>Los semestres deben estar entre 1 y 14. La fecha va en formato YYYY-MM</label>
                <div style="max-height: 300px; overflow-y: auto;">
                    <div id="error-tablaFormacion" class="text-danger"></div>
                    <table class="table table-bordered" id="tablaFormacion">
                        <thead>
                            <tr>
                                <th>Modalidad</th>
                                <th>Semestres</th>
                                <th>Graduado</th>
                                <th>Título</th>
                                <th>Terminación (YYYY-MM)</th>
                                <th>Tarjeta</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbodyFormacion"></tbody>
                    </table>
                </div>

                <button type="button" class="btn btn-primary" id="addRowTablaFormacion">Agregar</button>
            </fieldset>

            <fieldset class="form-group">
                <legend>Idiomas</legend>
                <label>Ingrese idiomas diferentes al español</label>
                <div style="max-height: 300px; overflow-y: auto;">
                    <div id="error-tablaIdiomas" class="text-danger"></div>
                    <table class="table table-bordered" id="tablaIdiomas">
                        <thead>
                            <tr>
                                <th>Idioma</th>
                                <th>Lo Habla</th>
                                <th>Lo Lee</th>
                                <th>Lo Escribe</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbodyIdiomas"></tbody>
                    </table>
                </div>

                <button type="button" class="btn btn-primary" id="addRowTablaIdiomas">Agregar</button>

            </fieldset>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="module" src="2-formacion-academica.js"></script>

</body>

</html>
