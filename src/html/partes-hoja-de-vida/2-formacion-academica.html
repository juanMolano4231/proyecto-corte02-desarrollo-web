<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formación Académica</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/3.4.0/paper/bootstrap.min.css">
</head>

<body>

    <div class="container">
        <h1 class="text-center">2 FORMACIÓN ACADÉMICA</h1>

        <br>

        <form action="#">
            <fieldset class="form-group">
                <legend>Educación básica y media</legend>

                <div class="form-group">
                    <label for="educacionBasica">Educacion basica</label>
                    <select class="form-control" id="educacionBasica" name="educacionBasica"></select>
                </div>

                <div class="form-group">
                    <div id="error-titulo" class="text-danger"></div>
                    <label for="titulo">Título obtenido</label>
                    <input type="text" class="form-control" id="titulo" name="titulo">
                </div>

                <div class="form-group">
                    <label for="fechaGrado">Fecha de grado</label>
                    <input type="date" class="form-control" id="fechaGrado" name="fechaGrado" min="1900-01-01">
                </div>

            </fieldset>

            <fieldset class="form-group">
                <legend>Educación superior (pregrado y posgrado)</legend>

                <!-- Con js -->
            </fieldset>

            <fieldset class="form-group">
                <legend>Idiomas</legend>

                <!-- Con js -->
            </fieldset>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="module" src="2-formacion-academica.js"></script>

</body>

</html>
