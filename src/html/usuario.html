<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/3.4.0/paper/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h1 class="text-center"></h1>
        <br>

        <form action="#">
            <fieldset class="form-group">
                <legend id="welcome">Bienvenido, </legend>

                <div class="form-group">
                    <h4>Estado actual de la Hoja de Vida</h4>
                    <input type="text" id="estado" class="form-control" readonly value="Fallo del estado al cargar">
                </div>

                <div class="form-group">
                    <button type="button" class="btn btn-primary" id="goToCV">Diligenciar Hoja de Vida</button>
                    <button type="button" class="btn btn-primary" id="logout">Cerrar sesión</button>
                </div>

                <br><br>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="module" src="usuario.js"></script>
</body>

</html>
