<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Personales</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

    <header class="container" style="position:relative; margin-top:20px;">
        <div class="text-center">
            <h3>FORMATO ÚNICO</h3>
            <h2>HOJA DE VIDA</h2>
        </div>
        <nav class="text-center" style="margin-top:10px;">
            <ul class="nav nav-pills" style="display:inline-block;">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="margin-top:20px;">
        <h1 class="text-center">LOGIN</h1>

        <br>

        <form action="#">
            <fieldset class="form-group">
                <legend>Iniciar sesión</legend>

                <div class="form-group">
                    <div id="error-usuario"></div>
                    <label for="usuario">Usuario</label>
                    <input type="text" class="form-control" id="usuario" name="usuario">
                </div>

                <div class="form-group">
                    <div id="error-contrasena"></div>
                    <label for="constrasena">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" name="contrasena">
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>
    </main>

    <footer class="container text-center" style="margin-top:40px;">
        <hr>
        <p>PÁGINA WEB: www.dafp.gov.co</p>
    </footer>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script type="module" src="login.js"></script>
</body>

</html>
